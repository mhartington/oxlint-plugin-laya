name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp install
      - run: vp check
      - run: vp run build
      - run: vp test
